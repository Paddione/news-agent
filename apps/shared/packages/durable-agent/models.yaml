# models.yaml: the model catalog SSOT next to its implementation (src/models.ts).
# Generated/checked against CATALOG + DEFAULT_MODEL in src/models.ts and the
# DNA_* model choices in the root .env.example. The check lives in
# tests/models-ssot.test.ts: every model the env can select must be in this catalog.
default: anthropic/claude-haiku-5.5
faux: faux-haiku

# The 30 OpenRouter models in CATALOG (src/models.ts). IDs must match exactly.
catalog:
  - anthropic/claude-haiku-5.5
  - anthropic/claude-opus-5.5
  - anthropic/claude-sonnet-5.5
  - anthropic/claude-fable-5.1
  - openai/gpt-6-astra
  - anthropic/claude-opus-5
  - openai/gpt-6.1-sol
  - anthropic/claude-fable-5
  - meta/muse-spark-1.3
  - openai/gpt-6-sol
  - x-ai/grok-4.7
  - xiaomi/mimo-v2.6-pro
  - x-ai/grok-4.6
  - z-ai/glm-5.3
  - moonshotai/kimi-k3
  - openai/gpt-5.6-terra
  - google/gemini-3.8-flash
  - qwen/qwen3.8-2.4t-a95b
  - deepseek/deepseek-v4.1-flash
  - google/gemini-3.7-flash
  - anthropic/claude-sonnet-5
  - openai/gpt-6-luna
  - xiaomi/mimo-v2.6-flash
  - openai/gpt-5.6-luna
  - deepseek/deepseek-v4-pro-0813
  - z-ai/glm-5.2
  - z-ai/glm-5.3-flash
  - google/gemini-3.1-pro-preview
  - minimax/minimax-m3
  - google/gemini-3.5-flash-lite

# Slot belegt: which env var selects which role. `local` slots are served by
# llama-server and are env-driven (any alias), so they are documented here but
# intentionally NOT members of the catalog above.
slots:
  openrouter:
    DNA_MODEL: catalog
    DNA_RESEARCH_MODEL: catalog
  local:
    DNA_MODEL: local-alias
    DNA_RESEARCH_MODEL: local-alias
    DNA_LOCAL_MODEL: local-alias
    DNA_HELPER_MODEL: local-alias
    DNA_FALLBACK_MODEL: hosted
    DNA_INVESTIGATE_FALLBACK_MODEL: hosted
