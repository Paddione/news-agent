apiVersion: apps/v1
kind: Deployment
metadata:
  name: dna-api
  namespace: workspace
  labels:
    app: dna-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dna-api
  template:
    metadata:
      labels:
        app: dna-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [gpu-cluster]
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/paddione/dna-api:cluster
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4850
              name: http
          env:
            - name: DNA_ENV_FILE
              value: none
            - name: DNA_HOST
              value: 0.0.0.0
            - name: DNA_PORT
              value: "4850"
            # The migrated state sits in live/ on the PVC (copied from ~/news-agent-data/live); the root holds only
            # lost+found and an empty store the pod created before this pointed here.
            - name: DNA_DATA_DIR
              value: /app/data/live
            # Agent model and judge both run on PK-Desktop, reached over the tailnet (news-judge-tailnet.service).
            - name: DNA_PROVIDER
              value: local
            - name: DNA_LOCAL_BASE_URL
              value: http://100.76.165.106:1919/v1
            # llama-server ignores the key; pi-ai's auth resolution needs one.
            - name: DNA_LOCAL_API_KEY
              value: local
            - name: DNA_MODEL
              value: qwen3.8-27b-gsq-rco-iq2s
            - name: DNA_RESEARCH_MODEL
              value: qwen3.8-27b-gsq-rco-iq2s
            # Fallback: OpenCode Go (flat subscription); muse-spark-1.3-contributor only speaks the Responses API there.
            - name: DNA_FALLBACK_BASE_URL
              value: https://opencode.ai/zen/go/v1
            - name: DNA_FALLBACK_MODEL
              value: muse-spark-1.3-contributor
            - name: DNA_FALLBACK_API
              value: openai-responses
            - name: DNA_FALLBACK_HEADERS
              value: '{"x-opencode-session":"dna-cluster","user-agent":"durable-news-agent/0.1"}'
            - name: DNA_FALLBACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dna-opencode
                  key: api-key
            - name: DNA_FALLBACK_COST
              value: "0,0"
            - name: DNA_FALLBACK_DAILY_SWEEPS
              value: "24"
            - name: JEV_BACKEND
              value: local
            - name: JEV_LOCAL_BASE_URL
              value: http://100.76.165.106:8010
            - name: JEV_MANIFEST
              value: /etc/dna-judge/manifest.json
            - name: NEWS_GPU_SESSION
              value: /etc/dna-judge/news-gpu-session
            - name: DNA_MODE
              value: live
            - name: DNA_SEARCH_MODE
              value: web
            - name: DNA_ISSUE_TRACKER
              value: gh
            - name: DNA_INVESTIGATE
              value: faux
            - name: DNA_CRON_SCHEDULE
              value: "* * * * *"
            - name: DNA_DEVICE_NAME
              value: cluster
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: openrouter-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: openai-api-key
            - name: FIRECRAWL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: firecrawl-api-key
                  optional: true
            - name: META_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: meta-api-key
                  optional: true
            - name: DNA_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: dna-client-token
            - name: DNA_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: dna-cron-token
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dna-secrets
                  key: gh-token
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /src/logs
            - name: judge
              mountPath: /etc/dna-judge
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4850
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dna-api-data
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: judge
          configMap:
            name: dna-judge
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: dna-api
  namespace: workspace
  labels:
    app: dna-api
spec:
  selector:
    app: dna-api
  ports:
    - name: http
      port: 4850
      targetPort: 4850
