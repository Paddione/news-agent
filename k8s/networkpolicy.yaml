apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dna-api
  namespace: workspace
spec:
  podSelector:
    matchLabels:
      app: dna-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 4850
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    # PK-Desktop on the tailnet: llama-server (agent model) and the news judge.
    - to:
        - ipBlock:
            cidr: 100.76.165.106/32
      ports:
        - protocol: TCP
          port: 1919
        - protocol: TCP
          port: 8010
---
